name: rose-meta-freshness

# Two monthly checks against upstream JULES, sharing one sparse clone.
#
# 1. Rebuild the rose metadata extract from upstream `main` and, if the
#    conditional rules have changed, describe what moved.
# 2. Sweep every `rose-stem/app/*/rose-app.conf` through the converter and the
#    schemas — the wide version of the ten apps vendored in
#    `tests/data/rose_apps/`, which the offline suite runs.
#
# Both report into the *same* issue, as separately titled sections. They are
# two symptoms of one cause — upstream moved — and triaging them together is
# what a maintainer actually wants; splitting them would mean two issues
# arriving on the same morning about the same commit. Which half fired is
# obvious from the sections present, and from the two distinct workflow steps.
#
# Deliberately an issue rather than a pull request: the right response to a new
# `fail-if`, or to an app that stopped validating, is a judgement call —
# implement it, defer it, or rule it out of scope — not a mergeable diff.

on:
  schedule:
    # 05:17 on the 1st of each month.
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  JULES_VERSION: vn7.9
  ISSUE_LABEL: rose-meta-drift

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv sync --group dev --locked

      - name: Clone the JULES rose metadata and rose-stem apps
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/MetOffice/jules.git reference/jules
          git -C reference/jules sparse-checkout set --no-cone rose-meta rose-stem
          git -C reference/jules checkout

      - name: Rebuild the extract from upstream main
        run: |
          uv run python scripts/rose_meta_extract.py extract \
            --jules-repo reference/jules \
            --version "$JULES_VERSION" \
            -o upstream.json

      - name: Diff against the committed extract
        id: drift
        run: |
          uv run python scripts/rose_meta_extract.py drift upstream.json \
            -o drift-report.md | tee -a "$GITHUB_OUTPUT"

      # The checkout is present, so `tests/rose/test_sweep.py` is no longer
      # skipped. It converts and validates every upstream app, and its failure
      # message names each app and its first validation error. `continue-on-
      # error` so a regression reaches the issue instead of only reddening the
      # run.
      - name: Sweep every rose-stem app
        id: sweep
        continue-on-error: true
        run: |
          if uv run pytest tests/rose/test_sweep.py -q --no-header -p no:randomly \
              > sweep.log 2>&1; then
            echo "regression=false" >> "$GITHUB_OUTPUT"
            echo "Every upstream rose-stem app converts and validates."
          else
            echo "regression=true" >> "$GITHUB_OUTPUT"
            {
              echo "## rose-stem sweep regression"
              echo
              echo "Apps in upstream \`rose-stem/app/\` that no longer convert"
              echo "and validate. The ten in \`tests/data/rose_apps/\` are"
              echo "covered by the offline suite; these are the rest."
              echo
              echo '```'
              tail -c 60000 sweep.log
              echo '```'
            } > sweep-report.md
          fi
          cat sweep.log

      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == 'true' || steps.sweep.outputs.regression == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = process.env.ISSUE_LABEL;
            const title = `upstream JULES drift (${process.env.JULES_VERSION})`;
            const read = (path) => fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : '';
            const body = [
              read('drift-report.md'),
              read('sweep-report.md'),
              '',
              `_Last checked by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                title,
                body,
              });
              core.notice(`Updated existing drift issue #${number}`);
              return;
            }

            // The label may not exist yet; creating it is idempotent enough.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Upstream JULES rose metadata or rose-stem apps have changed',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.notice(`Opened drift issue #${created.data.number}`);

      - name: Report no drift
        if: steps.drift.outputs.drift != 'true' && steps.sweep.outputs.regression != 'true'
        run: |
          echo "The committed extract matches upstream main, and every"
          echo "rose-stem app still converts and validates."
