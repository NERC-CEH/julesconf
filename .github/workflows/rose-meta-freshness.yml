name: rose-meta-freshness

# Rebuild the JULES rose metadata extract from upstream `main` and, if the
# conditional rules have changed, open (or update) an issue describing what
# moved. Deliberately an issue rather than a pull request: the right response
# to a new `fail-if` is a judgement call — implement it, defer it, or rule it
# out of scope — not a mergeable diff.

on:
  schedule:
    # 05:17 on the 1st of each month.
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  JULES_VERSION: vn7.9
  ISSUE_LABEL: rose-meta-drift

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - run: uv sync --group dev --locked

      - name: Clone the JULES rose metadata
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/MetOffice/jules.git reference/jules
          git -C reference/jules sparse-checkout set --no-cone rose-meta
          git -C reference/jules checkout

      - name: Rebuild the extract from upstream main
        run: |
          uv run python scripts/rose_meta_extract.py extract \
            --jules-repo reference/jules \
            --version "$JULES_VERSION" \
            -o upstream.json

      - name: Diff against the committed extract
        id: drift
        run: |
          uv run python scripts/rose_meta_extract.py drift upstream.json \
            -o drift-report.md | tee -a "$GITHUB_OUTPUT"

      - name: Open or update the drift issue
        if: steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = process.env.ISSUE_LABEL;
            const title = `rose metadata drift (${process.env.JULES_VERSION})`;
            const body = [
              fs.readFileSync('drift-report.md', 'utf8'),
              '',
              `_Last checked by [${context.workflow}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) on ${new Date().toISOString().slice(0, 10)}._`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              const number = existing.data[0].number;
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                title,
                body,
              });
              core.notice(`Updated existing drift issue #${number}`);
              return;
            }

            // The label may not exist yet; creating it is idempotent enough.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'b60205',
                description: 'Upstream JULES rose metadata has changed',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.notice(`Opened drift issue #${created.data.number}`);

      - name: Report no drift
        if: steps.drift.outputs.drift != 'true'
        run: echo "The committed extract matches upstream main."
