[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[project]
name = "julesconf"
version = "0.1.0"
description = "Python-based configuration management for the JULES land surface model."
authors = [
    { name = "jmarshrossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "dirconf>=0.5.2",
    "f90nml>=1.5",
    "h5netcdf[h5py]>=1.8.1",
    "numpy>=2.4.4",
    "pydantic>=2.13.4",
    "tomli-w>=1.0",
    "xarray>=2026.4.0",
]
keywords = ["configuration", "config"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "rust-just>=1.50.0",
    {include-group = "docs"},
    {include-group = "test"},
]
docs = [
    "griffe-pydantic>=1.1",
    "marimo>=0.23.5",
    "marimo-md-export>=0.5.2",
    "mkdocstrings[python]>=1.0.4",
    "zensical>=0.0.40",
    {include-group = "examples"},
]
examples = [
    "matplotlib>=3.10.9",
]
test = [
    "coverage>=7.13.5",
    "hypothesis>=6.152.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]


[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/", "scripts/"]
# Dev scripts are standalone modules, not a package; tests import them by
# putting scripts/ on sys.path, so pyright needs the same search path.
extraPaths = ["scripts"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
extend-exclude = [
    "jules-lsm.github.io",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Exempt test directory from pydocstyle rules
"tests/**" = ["D"]
# Attribute docstring prose for schema fields should not be hard-wrapped at 88 chars
"src/julesconf/schemas/**" = ["E501"]
# Marimo notebooks use bare expressions for display output (B018),
# contain prose that naturally exceeds 88 chars (E501),
# include academic citations with en dashes (RUF001),
# and may have unused variables from exploratory cells (F841).
"examples/**/*.py" = ["B018", "D", "E501", "F841", "RUF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "1 week"
