[project]

use_directory_urls = false

site_name = "julesconf"
site_description = "Documentation for the julesconf Python package."
site_author = "Joe Marsh Rossney"
site_url = "https://nerc-ceh.github.io/julesconf"

repo_name = "NERC-CEH/julesconf"
repo_url = "https://github.com/NERC-CEH/julesconf"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Getting started" = "guide/getting-started.md" },
    { "Working with namelists" = "guide/namelists.md" },
    { "Working with TOML" = "guide/toml.md" },
    { "Coming from rose" = "guide/rose.md" },
    { "Data files" = "guide/data-files.md" },
    { "Generating configs" = "guide/generating-configs.md" },
    { "Worked example" = "guide/worked-example.md" },
  ]},
  { "Reference" = [
    { "Command line" = "reference/cli.md" },
    { "Configuration reference" = [
      { "Overview" = "reference/schemas/index.md" },
      { "Run control" = [
        { "model_environment.nml" = "reference/schemas/model_environment.md" },
        { "timesteps.nml" = "reference/schemas/timesteps.md" },
        { "model_grid.nml" = "reference/schemas/model_grid.md" },
        { "jules_prnt_control.nml" = "reference/schemas/jules_prnt_control.md" },
        { "science_fixes.nml" = "reference/schemas/science_fixes.md" },
      ]},
      { "Surface types and vegetation" = [
        { "jules_surface_types.nml" = "reference/schemas/jules_surface_types.md" },
        { "pft_params.nml" = "reference/schemas/pft_params.md" },
        { "crop_params.nml" = "reference/schemas/crop_params.md" },
        { "nveg_params.nml" = "reference/schemas/nveg_params.md" },
        { "triffid_params.nml" = "reference/schemas/triffid_params.md" },
        { "jules_vegetation.nml" = "reference/schemas/jules_vegetation.md" },
        { "jules_surface.nml" = "reference/schemas/jules_surface.md" },
        { "urban.nml" = "reference/schemas/urban.md" },
      ]},
      { "Soil, water and snow" = [
        { "jules_soil.nml" = "reference/schemas/jules_soil.md" },
        { "jules_soil_biogeochem.nml" = "reference/schemas/jules_soil_biogeochem.md" },
        { "jules_hydrology.nml" = "reference/schemas/jules_hydrology.md" },
        { "jules_snow.nml" = "reference/schemas/jules_snow.md" },
        { "jules_rivers.nml" = "reference/schemas/jules_rivers.md" },
        { "jules_water_resources.nml" = "reference/schemas/jules_water_resources.md" },
        { "jules_irrig.nml" = "reference/schemas/jules_irrig.md" },
      ]},
      { "Input data" = [
        { "drive.nml" = "reference/schemas/drive.md" },
        { "initial_conditions.nml" = "reference/schemas/initial_conditions.md" },
        { "ancillaries.nml" = "reference/schemas/ancillaries.md" },
        { "prescribed_data.nml" = "reference/schemas/prescribed_data.md" },
      ]},
      { "Output" = [
        { "output.nml" = "reference/schemas/output.md" },
      ]},
      { "Optional science" = [
        { "jules_radiation.nml" = "reference/schemas/jules_radiation.md" },
        { "fire.nml" = "reference/schemas/fire.md" },
        { "jules_deposition.nml" = "reference/schemas/jules_deposition.md" },
        { "imogen.nml" = "reference/schemas/imogen.md" },
      ]},
    ]},
    { "Option values (enums)" = "reference/enums.md" },
    { "Warnings and errors" = "reference/warnings.md" },
    { "Coverage and versions" = "reference/coverage.md" },
    { "Python API" = [
      { "JulesNamelists" = "reference/api/namelists.md" },
      { "Containers and handlers" = "reference/api/config.md" },
      { "Grouped models" = "reference/api/grouped.md" },
      { "Field constraints" = "reference/api/constraints.md" },
    ]},
  ]},
  { "Developing" = [
    { "Staying in sync with JULES" = "develop/upstream.md" },
    { "Adding a schema" = "develop/adding-a-schema.md" },
    { "Tests and release" = "develop/testing.md" },
  ]},
]

[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/smile"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]


# Mkdocstrings
# ------------
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
docstring_style = "google"
docstring_section_style = "list"
inherited_members = true
line_length = 88
merge_init_into_class = true
separate_signature = false
show_signature = true
signature_crossrefs = true
show_signature_annotations = true
show_if_no_docstring = false
show_root_full_path = true
show_root_heading = true
show_root_members_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
extensions = ["griffe_pydantic"]
filters = ["!^_"]
